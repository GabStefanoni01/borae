name: Docker CI
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker-ci.yml"]
  push:
    branches: ["**"]
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker-ci.yml"]
jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t borae-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t borae-frontend:ci ./frontend
