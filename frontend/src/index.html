  <!-- Dados estruturados iniciais (Organization + WebSite) -->
  <script id="borae-structured-data-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://borae-web.onrender.com/#organization",
          "name": "Boraê",
          "url": "https://borae-web.onrender.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://borae-web.onrender.com/assets/images/borae-logo.png"
          },
          "description": "Plataforma gastronômica que aproxima restaurantes e consumidores por meio de cardápios digitais, descoberta e tecnologia."
        },
        {
          "@type": "WebSite",
          "@id": "https://borae-web.onrender.com/#website",

          "name": "Boraê",

            "@id": "https://borae-web.onrender.com/#organization"

        }

  <!-- Favicon: ícone oficial do app Boraê -->
  <link rel="icon" type="image/png" href="assets/images/brand/borae-app-icon.png">
  <link rel="apple-touch-icon" href="assets/images/brand/borae-app-icon.png">

  <!-- Aplica o tema salvo (claro/escuro/sistema) antes do Angular iniciar, evitando "piscar".
       Mesma regra de src/app/shared/theme.service.ts. -->
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('borae.theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <!-- Tipografia moderna: Plus Jakarta Sans e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
