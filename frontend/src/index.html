<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Boraê | Experiências gastronômicas mais inteligentes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF7200">
  <meta name="description" content="Conheça o Boraê, uma plataforma que conecta restaurantes e consumidores por meio de tecnologia, descoberta e novas experiências gastronômicas.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Boraê | Experiências gastronômicas mais inteligentes">
  <meta property="og:description" content="Conheça o Boraê, uma plataforma que conecta restaurantes e consumidores por meio de tecnologia, descoberta e novas experiências gastronômicas.">
  <meta property="og:image" content="assets/images/borae-logo.png">
  <meta property="og:locale" content="pt_BR">

  <!-- Favicon: ícone oficial do app Boraê -->
  <link rel="icon" type="image/png" href="assets/images/brand/borae-app-icon.png">
  <link rel="apple-touch-icon" href="assets/images/brand/borae-app-icon.png">

  <!-- Aplica o tema salvo (claro/escuro/sistema) antes do Angular iniciar, evitando "piscar".
       Mesma regra de src/app/shared/theme.service.ts. -->
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('borae.theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <!-- Tipografia moderna: Plus Jakarta Sans e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
