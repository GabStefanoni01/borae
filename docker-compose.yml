services:
  database:
    image: postgres:16-alpine
    container_name: borae-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: borae
      POSTGRES_USER: borae
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - borae-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borae -d borae"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    container_name: borae-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/borae
      DB_USERNAME: borae
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
    ports: ["8080:8080"]
    depends_on:
      database: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    container_name: borae-frontend
    restart: unless-stopped
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  borae-postgres-data:
