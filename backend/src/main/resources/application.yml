spring:
  application:
    name: borae-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/borae}
    username: ${DB_USERNAME:borae}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        max-age: 3600s
security:
  ip-headers: ${SECURITY_IP_HEADERS:X-Forwarded-For,X-Real-IP,CF-Connecting-IP}
  trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}
  headers:
    hsts-enabled: ${SECURITY_HSTS_ENABLED:false}
    hsts-max-age-seconds: ${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
    hsts-include-subdomains: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    issuer: ${JWT_ISSUER:borae-api}
  rate-limit:
    storage-mode: ${RATE_LIMIT_STORAGE_MODE:postgres}
    login-max: ${RATE_LIMIT_LOGIN_MAX:20}
    login-window-ms: ${RATE_LIMIT_LOGIN_WINDOW_MS:900000}
    login-max-failures: ${RATE_LIMIT_LOGIN_MAX_FAILURES:5}
    login-lockout-ms: ${RATE_LIMIT_LOGIN_LOCKOUT_MS:900000}
    register-max: ${RATE_LIMIT_REGISTER_MAX:10}
    invitation-accept-max: ${RATE_LIMIT_INVITATION_ACCEPT_MAX:15}
    invitation-send-hour-max: ${RATE_LIMIT_INVITATION_SEND_HOUR_MAX:10}
    invitation-send-day-restaurant-max: ${RATE_LIMIT_INVITATION_SEND_DAY_RESTAURANT_MAX:30}
    media-upload-max: ${RATE_LIMIT_MEDIA_UPLOAD_MAX:20}
    public-max: ${RATE_LIMIT_PUBLIC_MAX:120}
    admin-sensitive-max: ${RATE_LIMIT_ADMIN_SENSITIVE_MAX:30}
    default-max: ${RATE_LIMIT_DEFAULT_MAX:120}
    peak-max: ${RATE_LIMIT_PEAK_MAX:100}
    peak-window-ms: ${RATE_LIMIT_PEAK_WINDOW_MS:10000}
    attack-block-ms: ${RATE_LIMIT_ATTACK_BLOCK_MS:600000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  public-restaurant-url-prefix: ${PUBLIC_RESTAURANT_URL_PREFIX:http://localhost:4200/r/}
  assistant:
    session:
      # Configure um segredo dedicado de alta entropia em produção. security.jwt.secret atua apenas como fallback.
      secret: ${ASSISTANT_SESSION_SECRET:${security.jwt.secret:}}
      cookie-secure: ${ASSISTANT_SESSION_COOKIE_SECURE:false}
      cookie-same-site: ${ASSISTANT_SESSION_COOKIE_SAME_SITE:Lax}
    rate-limit:
      secret: ${ASSISTANT_RATE_LIMIT_SECRET:${app.assistant.session.secret:}}
    ai:
      primary-provider: ${AI_PRIMARY_PROVIDER:gemini}
      fallback-provider: ${AI_FALLBACK_PROVIDER:grok}
      fallback-enabled: ${AI_FALLBACK_ENABLED:true}
      fallback-on-auth-or-config-error: ${AI_FALLBACK_ON_AUTH_OR_CONFIG_ERROR:true}
      total-timeout-ms: ${AI_TOTAL_TIMEOUT_MS:15000}
      circuit-breaker:
        failure-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
        open-duration-ms: ${AI_CIRCUIT_BREAKER_OPEN_DURATION_MS:30000}
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      # Habilite somente após validar o tier/termos de processamento de dados do Google AI em produção.
      data-processing-approved: ${GEMINI_DATA_PROCESSING_APPROVED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
      timeout-ms: ${GEMINI_TIMEOUT_MS:0}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:12}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:500}
      input-price-per-million-usd: ${GEMINI_INPUT_PRICE_PER_MILLION_USD:0.10}
      output-price-per-million-usd: ${GEMINI_OUTPUT_PRICE_PER_MILLION_USD:0.40}
    grok:
      enabled: ${GROK_ENABLED:false}
      # Provedor secundário de contingência (Prioridade 2). Habilite apenas após homologação futura e aprovação de termos da xAI.
      data-processing-approved: ${GROK_DATA_PROCESSING_APPROVED:false}
      api-key: ${GROK_API_KEY:}
      base-url: ${GROK_BASE_URL:https://api.x.ai}
      model: ${GROK_MODEL:grok-3-mini}
      timeout-ms: ${GROK_TIMEOUT_MS:8000}
      max-output-tokens: ${GROK_MAX_OUTPUT_TOKENS:500}
  storage:
    imagekit:
      private-key: ${IMAGEKIT_PRIVATE_KEY:}
      url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
info:
  app:
    name: Boraê API
    version: 0.2.0
