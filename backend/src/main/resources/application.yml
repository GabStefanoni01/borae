spring:
  application:
    name: borae-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/borae}
    username: ${DB_USERNAME:borae}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never
security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  public-restaurant-url-prefix: ${PUBLIC_RESTAURANT_URL_PREFIX:http://localhost:4200/r/}
  assistant:
    session:
      # Use a dedicated high-entropy secret in production. JWT_SECRET is a development fallback only.
      secret: ${ASSISTANT_SESSION_SECRET:${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}}
      cookie-secure: ${ASSISTANT_SESSION_COOKIE_SECURE:false}
      cookie-same-site: ${ASSISTANT_SESSION_COOKIE_SAME_SITE:Lax}
    rate-limit:
      # Separate secret recommended in production; session secret is a development fallback.
      secret: ${ASSISTANT_RATE_LIMIT_SECRET:${ASSISTANT_SESSION_SECRET:${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}}}
      # Enable only when the reverse proxy overwrites X-Forwarded-For and is trusted.
      trust-forwarded-headers: ${ASSISTANT_TRUST_FORWARDED_HEADERS:false}
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      # Enable only after confirming the Google AI data-processing terms/tier for production.
      data-processing-approved: ${GEMINI_DATA_PROCESSING_APPROVED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:12}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:500}
      input-price-per-million-usd: ${GEMINI_INPUT_PRICE_PER_MILLION_USD:0.30}
      output-price-per-million-usd: ${GEMINI_OUTPUT_PRICE_PER_MILLION_USD:2.50}
  storage:
    imagekit:
      private-key: ${IMAGEKIT_PRIVATE_KEY:}
      url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
info:
  app:
    name: Boraê API
    version: 0.2.0
